[opcache]

; Enables the opcode cache. When disabled, code is not optimised or cached.
; The setting opcache.enable can not be enabled at runtime through ini_set(), it can only be disabled.
; Trying to enable it in a script will generate a warning.
; Default: 1
opcache.enable=1

; Enables the opcode cache for the CLI version of PHP.
; Default: 0
opcache.enable_cli=1

; The size of the shared memory storage used by OPcache, in megabytes.
; The minimum permissible value is "8", which is enforced if a smaller value is set.
; Default: 128
opcache.memory_consumption=512

; The amount of memory used to store interned strings, in megabytes.
; The maximum value is 32767 on 64bit architectures, and 4095 on 32bit architectures.
; Note: Prior to PHP 8.4.0, the maximum value was 4095 megabytes on all architectures.
; Default: 8
opcache.interned_strings_buffer=128

; The maximum number of keys (and therefore scripts) in the OPcache hash table.
; The actual value used will be the first number in the set of prime numbers
; { 223, 463, 983, 1979, 3907, 7963, 16229, 32531, 65407, 130987, 262237, 524521, 1048793 } that is greater than or equal to the configured value.
; The minimum value is 200. The maximum value is 1000000. Values outside of this range are clamped to the permissible range.
; Default: 10000
opcache.max_accelerated_files=65406

; The maximum percentage of wasted memory that is allowed before a restart is scheduled, if there is insufficient free memory.
; The maximum permissible value is "50", which is enforced if a larger value is set.
; Default: 5
opcache.max_wasted_percentage=15

; If enabled, OPcache appends the current working directory to the script key, thereby eliminating possible collisions between files with the same base name.
; Disabling this directive improves performance, but may break existing applications.
; Default: 1
;opcache.use_cwd=1

; If enabled, OPcache will check for updated scripts every opcache.revalidate_freq seconds.
; When this directive is disabled, you must reset OPcache manually via opcache_reset(), opcache_invalidate() or by restarting the Web server for changes to the filesystem to take effect.
; Note: OPcache may still validate the timestamp of a file at compile-time if opcache.file_update_protection or opcache.max_file_size options are set to non-zero values.
; Default: 1
opcache.validate_timestamps=0

; How often to check script timestamps for updates, in seconds. 0 will result in OPcache checking for updates on every request.
; This configuration directive is ignored if opcache.validate_timestamps is disabled.
; Default: 2
;opcache.revalidate_freq=2

; If disabled, existing cached files using the same include_path will be reused.
; Thus, if a file with the same name is elsewhere in the include_path, it won't be found.
; Default: 0
;opcache.revalidate_path=0

; If disabled, all documentation comments will be discarded from the opcode cache to reduce the size of the optimised code.
; Disabling this configuration directive may break applications and frameworks that rely on comment parsing for annotations, including Doctrine, Zend Framework 2 and PHPUnit.
; Default: 1
opcache.save_comments=1

; Enables or disables copying of PHP code (text segment) into HUGE PAGES.
; This should improve performance, but requires appropriate OS configuration. Available on Linux as of PHP 7.0.0, and on FreeBSD as of PHP 7.4.0.
; Default: 0
opcache.huge_code_pages=0

; For typical usage, this option accepts one of four string values:
;   disable: Completely disabled, cannot be enabled at runtime.
;   off: Disabled, but can be enabled at runtime.
;   tracing/on: Use tracing JIT. Enabled by default and recommended for most users.
;   function: Use function JIT.
; Default: tracing
opcache.jit=off

; The amount of shared memory to reserve for compiled JIT code. A zero value disables the JIT.
; When an int is used, the value is measured in bytes. Shorthand notation, as described in this FAQ, may also be used.
; Default: 0
opcache.jit_buffer_size=0