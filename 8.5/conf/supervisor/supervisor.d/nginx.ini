[program:nginx]
process_name=%(program_name)s_%(process_num)02d
command=/usr/sbin/nginx -g "daemon off;"
; Higher priority = starts last, stops first
priority=500
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
; QUIT = graceful shutdown: nginx finishes in-flight requests before exiting.
; The default TERM is a fast shutdown that drops active connections.
stopsignal=QUIT
stopwaitsecs=10