[program:php-fpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm --nodaemonize
; Lower priority = starts first, stops last: the socket must exist before
; nginx comes up, and fpm must outlive nginx's shutdown drain.
priority=100
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=10