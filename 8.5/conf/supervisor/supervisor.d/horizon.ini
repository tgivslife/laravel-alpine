[program:horizon]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan horizon
priority=200
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
; On SIGTERM horizon stops taking new jobs and waits for running ones to
; finish for 20s. Jobs still running after this are SIGKILLed.
stopwaitsecs=20