# /etc/nginx/nginx.conf

user nginx;

# Set number of worker processes automatically based on number of CPU cores.
worker_processes auto;

# Raises the per-worker open file descriptor limit above worker_connections,
# since each connection can use more than one fd (client + fastcgi upstream).
worker_rlimit_nofile 65535;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Configures default error logger.
error_log /dev/stderr warn;

# Includes files with directives to load dynamic modules.
include /etc/nginx/modules/*.conf;

# Include files with config snippets into the root context.
include /etc/nginx/conf.d/*.conf;

events {
	# The maximum number of simultaneous connections that can be opened by
	# a worker process.
	worker_connections 4096;

    # Let each process accept multiple connections.
    # Accept as many connections as possible, after nginx gets notification about a new connection.
    # May flood worker_connections, if that option is set too low.
    multi_accept on;

    # Preferred connection method for newer linux versions.
    # Essential for linux, optmized to serve many clients with each thread.
    use epoll;
}

http {
	# Includes mapping of file name extensions to MIME types of responses
	# and defines the default type.
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Name servers used to resolve names of upstream servers into addresses.
	# It's also needed when using tcpsocket and udpsocket in Lua modules.
	#resolver 1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001];

	# Don't tell nginx version to the clients. Default is 'on'.
	server_tokens off;

	# Specifies the maximum accepted body size of a client request, as
	# indicated by the request header Content-Length. If the stated content
	# length is greater than this size, then the client receives the HTTP
	# error code 413. Set to 0 to disable. Default is '1m'.
	client_max_body_size 50m;

    # Defines a timeout for reading a response from the FastCGI server.
    # The timeout is set only between two successive read operations, not for the transmission of the whole response.
    # If the FastCGI server does not transmit anything within this time, the connection is closed.
	fastcgi_read_timeout 60s;

	# Sendfile copies data between one FD and other from within the kernel,
	# which is more efficient than read() + write(). Default is off.
	sendfile on;

	# Causes nginx to attempt to send its HTTP response head in one packet,
	# instead of using partial frames. Default is 'off'.
	tcp_nopush on;

    # Enables or disables the use of the TCP_NODELAY option.
    # The option is enabled when a connection is transitioned into the keep-alive state.
    # Additionally, it is enabled on SSL connections, for unbuffered proxying, and for WebSocket proxying.
    tcp_nodelay on;

	# No ssl_* directives here: TLS is terminated by the upstream nginx that
	# proxies to this container, which only ever receives plain HTTP.

	# Gzip is intentionally left disabled here: compression is handled by the
	# upstream proxy nginx, so doing it again on this container would just
	# waste CPU on already-served content.
	#gzip on;


	# Helper variable for proxying websockets.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	# Specifies the main log format.
	log_format main '$remote_addr - $remote_user [$time_local] [$request_time] [$upstream_response_time] "$request" '
			'$status $body_bytes_sent "$http_referer" '
			'"$http_user_agent" "$http_x_forwarded_for"';

	# Sets the path, format, and configuration for a buffered log write.
	access_log /dev/stdout main;

    set_real_ip_from {{NGINX_SET_REAL_IP_FROM}};
    real_ip_header X-Forwarded-For;

	# Includes virtual hosts configs.
	include /etc/nginx/http.d/*.conf;
}
