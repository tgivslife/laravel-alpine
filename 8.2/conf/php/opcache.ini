[opcache]

; Determines if Zend OPCache is enabled
opcache.enable=1

; Determines if Zend OPCache is enabled for the CLI version of PHP
opcache.enable_cli=1

; opcache.revalidate_freq How often in seconds should the code cache expire and check if your code has changed.
; 0 means it checks your PHP code every single request IF YOU HAVE opcache.validate_timestamps ENABLED.
; opcache.validate_timestamps should not be enabled by default, as long as it's disabled then any value for opcache.
; revalidate_freq will basically be ignored. You should really only ever enable
; this during development, you don't really want to enable this setting for a production application.
opcache.revalidate_freq=0

; When disabled, you must reset the OPcache manually or restart the
; webserver for changes to the filesystem to take effect.
; For Development / testing, keep 1
; For performance / production, keep 0
opcache.validate_timestamps=0

; The maximum number of keys (scripts) in the OPcache hash table.
; Only numbers between 200 and 1000000 are allowed.
; If you have multiple PHP sites on the server then consider the value 130986
; for magento 2, keep 65406
opcache.max_accelerated_files=65406

; The OPcache shared memory storage size.
opcache.memory_consumption=512

; The maximum percentage of "wasted" memory until a restart is scheduled.
opcache.max_wasted_percentage=15

; The amount of memory for interned strings in Mbytes.
opcache.interned_strings_buffer=64

; If disabled, all PHPDoc comments are dropped from the code to reduce the
; size of the optimized code.
opcache.save_comments=1