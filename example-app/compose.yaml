services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      LARAVEL_SCHEDULER_ENABLE: "1"
      LARAVEL_HORIZON_ENABLE: "1"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel"]
      interval: 3s
      timeout: 3s
      retries: 10
